<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Análise de Emprestimos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-6">
    <div class="max-w-4xl mx-auto space-y-8">

        <header class="text-center">
            <h1 class="text-3xl font-bold text-blue-600">Análise de Empréstimos</h1>
            <p class="text-gray-600 mt-1">Consulte modalidades disponíveis e gerencie seus clientes</p>
        </header>

        <div class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">Dados do Cliente</h2>
            <form id="customerForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Nome Completo</label>
                    <input type="text" id="name" required class="w-full border p-2 rounded focus:ring-2 focud:ring-blue-500 outline-nome" placeholder="Ex: João da Silva"></input>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">CPF</label>
                    <input type="text" id="cpf" required class="w-full border p-2 rounded focus:ring-2 focud:ring-blue-500 outline-nome" placeholder="Ex: 123.456.789-00"></input>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Idade</label>
                    <input type="number" id="age" required class="w-full border p-2 rounded focus:ring-2 focud:ring-blue-500 outline-nome" placeholder="Ex: 28"></input>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Renda Mensal (R$)</label>
                    <input type="number" step="0.01" id="income" required class="w-full border p-2 rounded focus:ring-2 focud:ring-blue-500 outline-nome" placeholder="Ex: 3500.00"></input>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium mb-1">Estado (UF)</label>
                    <input type="text" id="location" required class="w-full border p-2 rounded focus:ring-2 focud:ring-blue-500 outline-nome uppercase" placeholder="Ex: SP"></input>
                </div>

                <div class="md:col-span-2 flex gap-3 pt-2">
                    <button type="button" onclick="analisarEmprestimos()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded transition ">
                        Analisar Empréstimos
                    </button>
                    <button type="button" onclick="cadastrarCliente()" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold py-2 px-4 rounded transition">
                        Cadastrar Cliente
                    </button>
                </div>
            </form>
        </div>

        <div id="resultSection" class="hidden bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-semibold mb-2 text-gray-700">Resultado para: <span id="costumerNameResult" class="text-blue-600"></span></h2>
            <div id="loanslist" class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4"></div>
        </div>

        <div class="bg-white p-6 rounded-lg shadow-md">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-gray-700">Clientes Cadastrados</h2>
                <button onclick="carregarClientes()" class="bg-gray-600 hover:bg-gray-700 text-white text-sm font-semibold py-1 px-3 rounded transition">
                    Atualizar Lista
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b">
                            <th class="p-2">ID</th>
                            <th class="p-2">Nome</th>
                            <th class="p-2">CPF</th>
                            <th class="p-2">Idade</th>
                            <th class="p-2">Renda</th>
                            <th class="p-2">UF</th>
                            <th class="p-2">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="costomersTableBody">
                        <tr>
                            <td colspan="7" class="text-center p-4 text-gray-500">Clique em "Atualizar Lista" para carregar os dados</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const API_URL = 'https://sistema-de-emprestimos.onrender.com';

        function getFormData() {
            return {
                name: document.getElementById('name').value,
                cpf: document.getElementById('cpf').value,
                age: Number(document.getElementById('age').value),
                income: Number(document.getElementById('income').value),
                location: document.getElementById('location').value.toUpperCase()
            };
        }

        async function analisarEmprestimos() {
            const payload = getFormData();
            if (!payload.name || !payload.cpf || !payload.age || !payload.income || !payload.location) {
                alert('Preencha todos os campos do formulário!');
                return;
            }

            try {
            const res = await fetch(`${API_URL}/customer-loans`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (!res.ok) throw new Error(data.message || 'Erro ao analisar empréstimos');

            document.getElementById('customerNameResult').textContent = data.customer;
            const container = document.getElementById('loansList');
            container.innerHTML = '';

            if (data.loans.length === 0) {
            container.innerHTML = '<p class="text-gray-500 col-span-3">Nenhuma modalidade de empréstimo disponível para este perfil.</p>';
            } else {
            data.loans.forEach(loan => {
                container.innerHTML += `
                <div class="border rounded-lg p-4 text-center border-blue-200 bg-blue-50">
                    <span class="text-xs font-bold uppercase tracking-wider text-blue-600">Modalidade</span>
                    <h3 class="text-lg font-bold text-gray-800 mt-1">${loan.type}</h3>
                    <p class="text-2xl font-black text-blue-700 mt-2">${loan.interest_rate}% <span class="text-xs font-normal text-gray-500">/mês</span></p>
                </div>
                `;
            });
            }

            document.getElementById('resultSection').classList.remove('hidden');
        } catch (err) {
            alert(err.message);
        }
        }

        async function cadastrarCliente() {
        const payload = getFormData();
        try {
            const res = await fetch(`${API_URL}/customers`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (!res.ok) throw new Error(data.message || 'Erro ao cadastrar cliente');

            alert('Cliente cadastrado com sucesso!');
            carregarClientes();
        } catch (err) {
            alert(err.message);
        }
        }

        async function carregarClientes() {
        try {
            const res = await fetch(`${API_URL}/customers`);
            const data = await res.json();

            const tbody = document.getElementById('customersTableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center p-4 text-gray-500">Nenhum cliente cadastrado.</td></tr>';
            return;
            }

            data.forEach(c => {
            tbody.innerHTML += `
                <tr class="border-b hover:bg-gray-50">
                <td class="p-2">${c.id}</td>
                <td class="p-2 font-medium">${c.name}</td>
                <td class="p-2">${c.cpf}</td>
                <td class="p-2">${c.age}</td>
                <td class="p-2">R$ ${Number(c.income).toFixed(2)}</td>
                <td class="p-2">${c.location}</td>
                <td class="p-2">
                    <button onclick="deletarCliente(${c.id})" class="text-red-600 hover:text-red-800 text-sm font-semibold">Excluir</button>
                </td>
                </tr>
            `;
            });
        } catch (err) {
            alert('Erro ao carregar lista de clientes');
        }
        }

        async function deletarCliente(id) {
        if (!confirm('Deseja realmente remover este cliente?')) return;
        try {
            const res = await fetch(`${API_URL}/customers/${id}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('Erro ao remover cliente');
            carregarClientes();
        } catch (err) {
            alert(err.message);
      }
        }
    </script>
</body>
</html>
